server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: shop-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/smartshop
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 0123456789

    jpa:
      hibernate:
        ddl-auto: none
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      show-sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

